services:
  - type: web
    name: researchpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: ENABLE_SPACY
        value: "0"
      - key: DATABASE_URL
        value: sqlite:///./researchpilot.db
    disk:
      name: researchpilot-storage
      mountPath: /app/storage
      sizeGB: 1
